<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ClipSync Pro Side Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 12px 16px;
      background: #090d16;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .url-badge {
      font-size: 11px;
      color: #94a3b8;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: monospace;
    }
    .tabs {
      display: flex;
      border-bottom: 1px solid #1e293b;
      background: #090d16;
    }
    .tabs button {
      flex: 1;
      padding: 10px;
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      border-bottom: 2px solid transparent;
    }
    .tabs button.active {
      color: #818cf8;
      border-bottom-color: #818cf8;
    }
    main {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
    }
    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
    }
    .btn-add {
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
      width: 100%;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .btn-add:hover { background: #4338ca; }
    textarea.scratchpad {
      width: 100%;
      height: 90px;
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #f1f5f9;
      padding: 8px;
      resize: vertical;
      font-size: 12px;
      margin-bottom: 12px;
    }
    footer {
      padding: 10px 14px;
      background: #090d16;
      border-top: 1px solid #1e293b;
      display: flex;
      gap: 8px;
    }
    .btn-export {
      flex: 1;
      padding: 8px;
      background: #334155;
      color: #f8fafc;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
    }
    .btn-export:hover { background: #475569; }
  </style>
</head>
<body>
  <header>
    <div>
      <strong>ClipSync Pro</strong>
      <div id="pageUrlDisplay" class="url-badge" title="Active Page URL">Loading link...</div>
    </div>
  </header>

  <nav class="tabs">
    <button id="btnTabStickies" class="active">Stickies</button>
    <button id="btnTabVault">All Websites</button>
  </nav>

  <main id="mainContainer">
    <div id="stickiesView">
      <button id="btnQuickAdd" class="btn-add">+ Add Note to this Page</button>
      <div class="section-title">URL Scratchpad</div>
      <textarea id="pageScratchpad" class="scratchpad" placeholder="Scratchpad for this URL..."></textarea>
      <div class="section-title">Notes on this URL</div>
      <div id="stickiesList"></div>
    </div>
    <div id="vaultView" style="display: none;">
      <div class="section-title">All URLs with Saved Notes</div>
      <div id="vaultList"></div>
    </div>
  </main>

  <footer>
    <button id="btnExportMd" class="btn-export">Export Markdown (.md)</button>
    <button id="btnExportJson" class="btn-export">Export JSON</button>
  </footer>
  <script src="sidepanel.js"></script>
</body>
</html>
